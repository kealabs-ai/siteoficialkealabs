<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A2540" />
    <meta name="description" content="Kealabs - Business Intelligence e Agentes de IA" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <title>Kealabs - BI e Agentes de IA</title>
    <style>
      #root {
        width: 100%;
        height: 100vh;
        overflow: auto;
      }
      
      #root::-webkit-scrollbar {
        width: 12px;
      }
      
      #root::-webkit-scrollbar-track {
        background: rgba(248, 250, 252, 0.5);
        border-radius: 10px;
      }
      
      #root::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #10B981 0%, #00B4D8 100%);
        border-radius: 10px;
        border: 2px solid rgba(248, 250, 252, 0.5);
      }
      
      #root::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(180deg, #00B4D8 0%, #10B981 100%);
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
      }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para executar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>
